# 경계·구조 위반 기준선 (FreezingArchRule)
# 기준선에 있는 옛 위반은 통과, 새 위반은 실패. 고친 위반은 실행할 때 기준선에서 자동으로 빠진다.
freeze.store.default.path=src/test/resources/archunit_store

# 기준선 폴더(archunit_store)가 없을 때 새로 만들지 않는다.
# 이미 있는 폴더에 새 규칙의 기준선이 추가되는 것은 이 설정으로 막지 못한다. 그것은 아래 RatchetViolationStore가 막는다.
freeze.store.default.allowStoreCreation=false

# 기준선에 없는 규칙을 만나면 기준선을 만들어 주지 않고 실패시킨다.
# 규칙은 설명 문자열로 구분되므로 because(...) 문구만 고쳐도 "없는 규칙"이 된다 (TROUBLESHOOTING T-006).
freeze.store=com.bready.server.architecture.RatchetViolationStore

# 새 규칙을 추가할 때만 잠깐 true 로 바꿔 기준선을 만들고 바로 false 로 돌린다. 만들어진 기준선의 건수를 확인한다.
freeze.store.allowNewRules=false

# 기준선을 통째로 다시 만들지 않는다. 위반을 "인정"하려면 사용자 결정이 필요하다.
freeze.refreeze=false