spring:
  application:
    name: place-catalog-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/bready?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:bready-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: ${SERVER_PORT:8081}

kakao:
  base-url: ${KAKAO_BASE_URL:https://dapi.kakao.com}
  rest-api-key: ${KAKAO_REST_API_KEY:local-dummy-kakao-rest-api-key}

management:
  endpoints:
    web:
      exposure:
        include: health, info
