# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"
early_access: true

tone_instructions: >
  한국어로 정중하고 협업적인 톤의 코드 리뷰를 제공합니다.
  모놀리식을 Strangler Fig로 MSA 전환하는 레포입니다. 모듈 경계와 서비스로 떼어낼 수 있는 모양을 가장 중요하게 봅니다.

reviews:
  profile: "assertive"
  high_level_summary: true
  changed_files_summary: true
  review_status: true
  collapse_walkthrough: true
  abort_on_close: true

  path_filters:
    - "**/src/**"
    - "**/build.gradle"
    - "**/settings.gradle"
    - "**/Dockerfile"
    - "**/.dockerignore"
    - "docker-compose*.yml"
    - ".github/**"
    - ".claude/hooks/**"
    - ".claude/scripts/**"
    - ".claude/rules/**"
    - ".claude/settings.json"
    - "CLAUDE.md"
    - ".coderabbit.yaml"
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/gradle/wrapper/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.svg"

  path_instructions:
    - path: "**/src/main/**/*.java"
      instructions: |
        규칙의 원본은 .claude/rules/*.md 다. 지침과 규칙이 다르면 규칙을 따른다.

        [리뷰 우선순위]
        1) 모듈 경계 (msa-boundary.md): 다른 컨텍스트의 Repository 주입, Entity를 필드·파라미터·반환 타입으로 사용,
           다른 컨텍스트 테이블 JOIN, 한 트랜잭션에서 다른 컨텍스트 데이터 쓰기. 컨텍스트 사이는 {module}.api 패키지의
           인터페이스·record·enum으로만 오간다. 컨텍스트: Identity(auth+user) · Planning(plan+trigger) · Place Catalog(place)
           · Recommendation · Stats · File(s3)
        2) 보안: 사용자 데이터를 바꾸는 엔드포인트의 소유권 검증(@CurrentUser + plan.validateOwner), 입력 검증 누락,
           로그에 토큰·비밀번호·DTO 통째 출력
        3) 정합성: 트랜잭션 경계, 외부 I/O(HTTP·S3·OpenAI)가 트랜잭션 안에 있는지, 락 → 검증 순서, 중복 생성은 유니크 제약
        4) 성능: N+1, 페이징 + 컬렉션 fetch join
        5) 설계·가독성

        [이 레포의 규칙 — 일반적인 관례와 다른 것]
        - 서비스 인터페이스(XxxUsecase)를 만들지 않는다. 인터페이스는 다른 컨텍스트가 부르는 {module}.api 공개 API에만
        - 예외 클래스를 새로 만들지 않는다. ApplicationException.from(모듈별 ErrorCase)만. IllegalArgumentException 등을 도메인 규칙에 쓰지 않는다
        - DTO는 요청·응답 모두 record, 이름은 {Resource}{Action}Request/Response (예: PlanCreateRequest)
        - 엔티티: setter 금지, 정적 팩토리 create, @NoArgsConstructor(access = PROTECTED), 현재 시각은 파라미터로 받는다
        - 서비스: 클래스에 @Transactional(readOnly = true), 쓰기 메서드에만 @Transactional, 시각은 Clock 주입
        - 컨트롤러는 위임만. Swagger 어노테이션은 {Domain}Api 인터페이스에
        - global 패키지에 도메인 지식(특정 모듈의 ErrorCase·엔티티)을 넣지 않는다
        - 옛 코드의 규칙 위반을 흉내 낸 새 코드는 지적한다

    - path: "**/src/test/**/*.java"
      instructions: |
        규칙의 원본은 .claude/rules/testing.md 다.
        - 엔티티를 mock하지 않는다. fixture로 진짜 객체를 만든다
        - Mockito는 BDD(given/then). when().thenReturn() 금지. @MockBean이 아니라 @MockitoBean
        - 단언은 AssertJ만. JUnit assertEquals 금지
        - 리포지토리·통합 테스트는 Testcontainers MySQL. H2 금지
        - 테스트가 실제로 무엇을 증명하는지 본다. 실행 순서에 따라 결과가 바뀌는 테스트(공유 상태)를 지적한다
        - 외부 API(카카오·OpenAI·S3)를 실제로 호출하지 않는다

    - path: "gateway-service/**"
      instructions: |
        Spring Cloud Gateway(WebFlux). 도메인 로직을 두지 않는다.
        - 라우트는 위에서부터 비교해 먼저 맞은 하나를 탄다. 좁은 경로가 넓은 경로(/**)보다 위에 있는지 본다
        - CORS는 Gateway(globalcors) 한 곳에서만. 뒤쪽 서비스가 CORS 헤더를 다시 붙이면 Access-Control-Allow-Origin이 중복된다
        - X-Forwarded 헤더는 trusted-proxies를 설정해야 켜진다. 켤 때 ".*"로 모두 믿지 않는다
        - 뒤쪽 주소는 환경 변수(${XXX_URI:기본값})로 둔다

    - path: "**/src/test/resources/archunit_store/**"
      instructions: |
        ArchUnit 래칫 기준선이다. 위반은 줄기만 해야 한다. 줄이 추가되면 새 위반을 인정하는 것이므로 반드시 지적하고
        이유(ADR·설계서)가 있는지 확인한다. 규칙 설명 문구가 바뀌면 stored.rules도 함께 바뀌었는지 본다.

    - path: "**/src/main/resources/**"
      instructions: |
        설정에는 ${ENV_VAR:로컬더미값}만 둔다. 실제 키·비밀번호·토큰 값이 들어오면 반드시 지적한다.
        외부 연동(OpenAI·S3·카카오·네이버)은 키 없이 로컬에서 기동할 수 있어야 한다.

    - path: "**/Dockerfile"
      instructions: |
        멀티 스테이지(JDK에서 빌드, JRE로 실행)를 유지한다. 실행 이미지에 소스·빌드 도구·시크릿이 들어가지 않는지 본다.

    - path: "docker-compose*.yml"
      instructions: |
        로컬 전용 구성이다. 비밀번호는 ${VAR:-로컬더미값}만. app 프로필에서 모놀리식 등 뒤쪽 서비스는 호스트에 포트를 열지 않고
        Gateway(8000)만 연다. 컨테이너 안에서 localhost는 자기 자신이므로 서비스 이름으로 연결하는지 본다.

    - path: ".github/workflows/**"
      instructions: |
        시크릿을 쓰지 않는다(테스트는 키 없이 돈다). 서비스 목록은 gradlew가 있는 디렉터리를 찾아 만든다. 목록을 손으로 적으면
        새 서비스가 조용히 빠지므로 지적한다. permissions는 최소로.

    - path: ".claude/**"
      instructions: |
        Claude Code 하네스(훅·스크립트·규칙)다. 훅은 실패해도 조용히 통과하지 않아야 한다(검사하지 못한 것은 출력으로 알린다).
        셸 스크립트는 macOS 기본 bash 3.2에서도 동작해야 한다(set -u에서 빈 배열 펼치기 등).

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"
    labels:
      - "!wip"
      - "!draft"
      - "!skip-review"

  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    hadolint:
      enabled: true
    pmd:
      enabled: true

chat:
  auto_reply: true
  art: false

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - ".claude/rules/*.md"
