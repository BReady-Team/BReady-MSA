services:
  mysql:
    image: mysql:8.0
    container_name: bready-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bready-local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bready}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # place-catalog-service 전용 DB
  catalog-mysql:
    image: mysql:8.0
    container_name: bready-catalog-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CATALOG_MYSQL_ROOT_PASSWORD:-catalog-local}
      MYSQL_DATABASE: catalog
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - catalog-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: bready-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 모놀리식은 호스트에 포트를 열지 않고, 클라이언트는 Gateway(8000)로만 들어온다
  monolith:
    profiles: ["app"]
    build: ./monolith
    container_name: bready-monolith
    expose:
      - "8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-bready}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bready-local}
      REDIS_HOST: redis
      PLACE_CATALOG_URI: http://place-catalog:8081
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      place-catalog:
        condition: service_started

  place-catalog:
    profiles: ["app"]
    build: ./place-catalog-service
    container_name: bready-place-catalog
    expose:
      - "8081"
    environment:
      DB_URL: jdbc:mysql://catalog-mysql:3306/catalog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_PASSWORD: ${CATALOG_MYSQL_ROOT_PASSWORD:-catalog-local}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-local-dummy-kakao-rest-api-key}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      catalog-mysql:
        condition: service_healthy

  gateway:
    profiles: ["app"]
    build: ./gateway-service
    container_name: bready-gateway
    ports:
      - "8000:8000"
    environment:
      MONOLITH_URI: http://monolith:8080
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      - monolith

  # 관측: docker compose --profile monitoring up -d
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.52.0
    container_name: bready-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # 추적 저장은 메모리에, 컨테이너를 내리면 사라지도록
  zipkin:
    profiles: ["monitoring"]
    image: openzipkin/zipkin:3.4.4
    container_name: bready-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.2.3
    container_name: bready-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  mysql-data:
  catalog-mysql-data:
  redis-data:
  grafana-data:
