services:
  mysql:
    image: mysql:8.0
    container_name: bready-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bready-local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bready}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: bready-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 모놀리식은 호스트에 포트를 열지 않고, 클라이언트는 Gateway(8000)로만 들어온다
  monolith:
    profiles: ["app"]
    build: ./monolith
    container_name: bready-monolith
    expose:
      - "8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-bready}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bready-local}
      REDIS_HOST: redis
      PLACE_CATALOG_URI: http://place-catalog:8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      place-catalog:
        condition: service_started

  place-catalog:
    profiles: ["app"]
    build: ./place-catalog-service
    container_name: bready-place-catalog
    expose:
      - "8081"
    environment:
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-local-dummy-kakao-rest-api-key}

  gateway:
    profiles: ["app"]
    build: ./gateway-service
    container_name: bready-gateway
    ports:
      - "8000:8000"
    environment:
      MONOLITH_URI: http://monolith:8080
    depends_on:
      - monolith

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: bready-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: bready-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  grafana-data:
