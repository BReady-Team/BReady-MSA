name: BReady CI (MSA)

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  services:
    name: find services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find services
        id: find
        run: |
          services=()
          missing=()
          for dir in */; do
            dir="${dir%/}"
            if [ -x "$dir/gradlew" ]; then
              services+=("$dir")
            elif [ -f "$dir/build.gradle" ] || [ -d "$dir/src" ]; then
              missing+=("$dir")
            fi
          done
          # 빌드 파일·src는 있는데 gradlew가 없으면 조용히 빠지지 않게 실패
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::gradlew가 없어 빌드할 수 없는 서비스: ${missing[*]}"
            exit 1
          fi
          if [ ${#services[@]} -eq 0 ]; then
            echo "::error::검증할 서비스가 없다"
            exit 1
          fi
          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -cs .)
          echo "services: $json"
          echo "services=$json" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.service }})
    needs: services
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.services) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: |
            ${{ matrix.service }}/*.gradle
            ${{ matrix.service }}/gradle/wrapper/gradle-wrapper.properties

      # build = spotlessCheck + 컴파일 + 전체 테스트
      - name: Build & test
        working-directory: ${{ matrix.service }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/
