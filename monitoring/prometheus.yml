global:
  scrape_interval: 5s

# compose app 프로필로 띄운 서비스만 수집
scrape_configs:
  - job_name: "gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: "monolith"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["monolith:8080"]

  - job_name: "place-catalog"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["place-catalog:8081"]
